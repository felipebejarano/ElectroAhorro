<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroAhorro - Catálogo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="encabezado">
        <h1>ElectroAhorro</h1>
        <p>Tecnología eficiente para mitigar los costos del Fenómeno de El Niño 2026.</p>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main style="display: flex; gap: 2rem; flex-wrap: wrap;">
        
        <section style="flex: 3; min-width: 300px;">
            <h2>Catálogo de Soluciones de Eficiencia Energética</h2>
            <p style="margin-bottom: 1.5rem;">Filtra o busca los dispositivos ideales para tu hogar.</p>
            
            <div style="margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap;">
                <input type="text" id="buscador" placeholder="Buscar producto por nombre..." style="flex: 1; min-width: 200px; padding: 0.7rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <div style="margin-bottom: 2rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <button class="btn-filtro" data-categoria="todos" style="padding: 0.5rem 1rem; cursor: pointer; border: 1px solid #0f4c81; background: #0f4c81; color: white; border-radius: 4px;">Todos</button>
                <button class="btn-filtro" data-categoria="iluminacion" style="padding: 0.5rem 1rem; cursor: pointer; border: 1px solid #0f4c81; background: white; color: #0f4c81; border-radius: 4px;">Iluminación</button>
                <button class="btn-filtro" data-categoria="automatizacion" style="padding: 0.5rem 1rem; cursor: pointer; border: 1px solid #0f4c81; background: white; color: #0f4c81; border-radius: 4px;">Automatización</button>
                <button class="btn-filtro" data-categoria="medidores" style="padding: 0.5rem 1rem; cursor: pointer; border: 1px solid #0f4c81; background: white; color: #0f4c81; border-radius: 4px;">Medidores</button>
                <button class="btn-filtro" data-categoria="climatizacion" style="padding: 0.5rem 1rem; cursor: pointer; border: 1px solid #0f4c81; background: white; color: #0f4c81; border-radius: 4px;">Climatización</button>
            </div>
            <div id="contenedor-productos" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem;">
               
            </div>
        </section>
        <aside style="flex: 1; min-width: 250px; background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content;">
            <h3 style="color: var(--color-primario); margin-bottom: 1rem;">🛒 Tu Carrito</h3>
            <ul id="lista-carrito" style="list-style: none; padding: 0; margin-bottom: 1rem;">
                <p style="color: #777; font-size: 0.9rem;">El carrito está vacío.</p>
            </ul>
            <div style="border-top: 2px solid #eee; padding-top: 1rem; margin-bottom: 1rem; display: flex; justify-content: space-between; font-weight: bold;">
                <span>Total:</span>
                <span id="total-carrito" style="color: var(--color-secundario);">$ 0 COP</span>
            </div>
            <button onclick="alert('¡Compra simulada con éxito! Gracias por ahorrar energía con ElectroAhorro.')" style="width: 100%; background-color: var(--color-secundario); color: white; border: none; padding: 0.7rem; border-radius: 4px; cursor: pointer; font-weight: 600;">Finalizar Compra</button>
        </aside>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
