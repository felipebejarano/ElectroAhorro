<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroAhorro - Contacto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="encabezado">
        <h1>ElectroAhorro</h1>
        <p>Tecnología eficiente para mitigar los costos del Fenómeno de El Niño 2026.</p>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <section style="max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h2 style="text-align: center; color: var(--color-primario); margin-bottom: 1rem;">Contáctanos</h2>
            <p style="text-align: center; margin-bottom: 1.5rem; font-size: 0.95rem; color: #666;">
                ¿Tienes dudas sobre nuestros dispositivos de ahorro o requieres asesoría para tu hogar? Déjanos tus datos.
            </p>

            <form onsubmit="event.preventDefault(); alert('¡Mensaje enviado con éxito! Nos pondremos en contacto contigo pronto.');" style="display: flex; flex-direction: column; gap: 1rem;">
                                
                <div>
                    <label for="nombre" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Nombre Completo:</label>
                    <input type="text" id="nombre" required placeholder="Ej. Juan Pérez" style="width: 100%; padding: 0.7rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div>
                    <label for="email" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Correo Electrónico:</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com" style="width: 100%; padding: 0.7rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div>
                    <label for="telefono" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Teléfono / Celular:</label>
                    <input type="tel" id="telefono" required placeholder="3001234567" style="width: 100%; padding: 0.7rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div>
                    <label for="asunto" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Asunto de Interés:</label>
                    <select id="asunto" style="width: 100%; padding: 0.7rem; border: 1px solid #ccc; border-radius: 4px; background: white;">
                        <option value="asesoria">Asesoría Energética Residencial</option>
                        <option value="productos">Dispositivos y Medidores</option>
                        <option value="soporte">Soporte Técnico</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div>
                    <label for="mensaje" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Mensaje:</label>
                    <textarea id="mensaje" rows="4" required placeholder="Escribe tu consulta aquí..." style="width: 100%; padding: 0.7rem; border: 1px solid #ccc; border-radius: 4px; resize: vertical;"></textarea>
                </div>

                <button type="submit" style="background-color: var(--color-secundario); color: white; border: none; padding: 0.8rem; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 0.5rem;">Enviar Mensaje</button>
            </form>
        </section>
    </main>

</body>
</html>
